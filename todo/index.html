<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Todo</title>
</head>

<body>
    <header>
        <div class="heading">
            <h1>To Do App</h1>
        </div>
    </header>
    <main>
        <div class="content">
            <form id="taskForm">
                <input type="text" id="taskInput" placeholder="Add a new task">
                <button type="button" id="submitButton">Add Task</button>
            </form>
            <ul class="tasksList">

            </ul>
        </div>
    </main>
    <script src="index.js"></script>
</body>

</html>
